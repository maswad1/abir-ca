name: Integrate AH logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-ah-logo.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrate AH logo into header and footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '.brand{display:flex;flex-direction:column;line-height:.92;min-width:235px}\n'
          new = old + '    .brand-mark{display:flex;align-items:center;gap:9px}\n    .brand-logo{width:38px;height:25px;object-fit:contain;flex:0 0 auto}\n'
          if old not in s:
              raise SystemExit('Brand CSS anchor not found')
          s = s.replace(old, new, 1)

          old = '.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}'
          new = '.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}\n    .footer-brand{display:flex;align-items:center;gap:12px}\n    .footer-logo{width:44px;height:auto}'
          if old not in s:
              raise SystemExit('Footer CSS anchor not found')
          s = s.replace(old, new, 1)

          old = '.brand b{font-size:25px}.brand small{font-size:8px}'
          new = '.brand b{font-size:25px}.brand small{font-size:8px}.brand-logo{width:32px;height:21px}'
          if old not in s:
              raise SystemExit('Mobile brand CSS anchor not found')
          s = s.replace(old, new, 1)

          old = '<a class="brand" href="#home" aria-label="Abir.ca home"><b>ABIR.CA</b><small>ABIR HLAL | REAL ESTATE</small></a>'
          new = '<a class="brand" href="#home" aria-label="Abir.ca home"><span class="brand-mark"><img class="brand-logo" src="pictures/abir_logo_ah.png" alt="" aria-hidden="true"><b>ABIR.CA</b></span><small>ABIR HLAL | REAL ESTATE</small></a>'
          if old not in s:
              raise SystemExit('Header brand anchor not found')
          s = s.replace(old, new, 1)

          old = '<footer><div class="wrap foot"><span>© <span id="year"></span> Abir Hlal Real Estate.</span><span>ABIR.CA</span></div></footer>'
          new = '<footer><div class="wrap foot"><span class="footer-brand"><img class="footer-logo" src="pictures/abir_logo_ah.png" alt="" aria-hidden="true"><span>© <span id="year"></span> Abir Hlal Real Estate.</span></span><span>ABIR.CA</span></div></footer>'
          if old not in s:
              raise SystemExit('Footer markup anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit site update and remove updater
        shell: bash
        run: |
          rm .github/workflows/integrate-ah-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/integrate-ah-logo.yml
          git commit -m 'Integrate Abir AH logo into site branding'
          git push
