name: Remove Manual Maintenance Sections
on:
  push:
    paths:
      - '.github/scripts/remove_manual_sections.py'
      - '.github/workflows/run-remove-manual-sections.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove manual-maintenance sections
        run: python .github/scripts/remove_manual_sections.py
      - name: Commit update and remove temporary updater
        run: |
          rm -f .github/scripts/remove_manual_sections.py .github/workflows/run-remove-manual-sections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove manual-maintenance website sections"
          git push
