name: Fix desktop mobile menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-desktop-mobile-menu.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide mobile menu on desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '.menu{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:26px}'
          if '.mobile-links{display:none}' not in s.split('@media(max-width:980px)')[0]:
              s = s.replace(marker, marker + '\n    .mobile-links{display:none}')
          p.write_text(s)
          PY
      - name: Commit fix and remove updater
        run: |
          rm .github/workflows/fix-desktop-mobile-menu.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-desktop-mobile-menu.yml
          git commit -m 'Hide mobile navigation on desktop'
          git push
