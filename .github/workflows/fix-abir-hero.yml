name: Fix Abir hero image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Switch hero to PNG and tighten crop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('pictures/abir_on_desk_1.webp?v=1', 'pictures/Abir_on_Desk_1.png?v=3')
          s = s.replace('.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 45%}', '.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;transform:scale(1.08)}')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f pictures/Abir_on_Desk_1.webp pictures/abir_on_desk_1.webp
          rm -f .github/workflows/fix-abir-hero.yml

      - name: Commit finished site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Use PNG hero photo and tighten portrait crop"
            git push
          fi
