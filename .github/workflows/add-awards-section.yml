name: Add Awards Section
on:
  push:
    paths:
      - '.github/workflows/add-awards-section.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add awards section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="#communities">Communities</a><a href="#contact">Contact</a>','<a href="#communities">Communities</a><a href="#awards">Awards</a><a href="#contact">Contact</a>')
          css=base64.b64decode('').decode()
          html=base64.b64decode('').decode()
          if '.awards{' not in s: s=s.replace('    .cta{padding:36px 0;background:#0a0a0b;border-top:1px solid #151517}',css+'    .cta{padding:36px 0;background:#0a0a0b;border-top:1px solid #151517}')
          if 'id="awards"' not in s: s=s.replace('    <section class="cta" id="contact">',html+'    <section class="cta" id="contact">')
          s=s.replace('      .tile-frame{height:280px}.showcase-grid{grid-template-columns:1fr}.feature{min-height:500px}','      .tile-frame{height:280px}.showcase-grid{grid-template-columns:1fr}.feature{min-height:500px}.awards-grid{grid-template-columns:1fr 1fr}')
          s=s.replace('      .cta-grid{display:block}.cta .btn{margin-top:22px}.cta h3{font-size:32px}','      .awards{padding:48px 0}.awards-head{display:block}.awards-head p{margin-top:14px}.awards-grid{grid-template-columns:1fr}.award-card{min-height:190px}.cta-grid{display:block}.cta .btn{margin-top:22px}.cta h3{font-size:32px}')
          p.write_text(s)
          PY
      - name: Commit update and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-awards-section.yml
          git add index.html .github/workflows/add-awards-section.yml
          git commit -m "Add Awards and Recognition section"
          git push