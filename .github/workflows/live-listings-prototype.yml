name: Live listings prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-listings-prototype.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace static listings with live Realty ONE embed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          css_anchor = "    .showcase{padding:56px 0;background:#0d0d0f;border-top:1px solid var(--line)}"
          live_css = """    .live-listings{padding:56px 0;background:#0d0d0f;border-top:1px solid var(--line)}\n    .live-listings-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}\n    .live-listings-head h2{margin:8px 0 0}\n    .live-listings-head p{max-width:470px;color:var(--muted);font-size:14px;margin:0}\n    .listings-frame-wrap{border:1px solid #2b2b2e;border-radius:18px;overflow:hidden;background:#fff;min-height:900px;box-shadow:0 18px 55px rgba(0,0,0,.28)}\n    .listings-frame{display:block;width:100%;height:900px;border:0;background:#fff}\n    .listings-fallback{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px;padding:18px 20px;border:1px solid #2a2a2d;border-radius:14px;background:#141416}\n    .listings-fallback span{color:var(--muted);font-size:13px}\n"""
          if '.live-listings{' not in s:
              s = s.replace(css_anchor, live_css + css_anchor)

          new_section = '''    <section class="live-listings" id="listings">
      <div class="wrap">
        <div class="live-listings-head">
          <div><div class="eyebrow">Featured listings</div><h2>Abir's live listings.</h2></div>
          <p>This section is connected directly to Abir's Realty ONE Group featured-listings page, so inventory and status changes remain controlled by the live brokerage source.</p>
        </div>
        <div class="listings-frame-wrap">
          <iframe class="listings-frame" src="https://abirhlal.myrealtyonegroup.com/my-featured-listings" title="Abir Hlal live featured listings" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <div class="listings-fallback">
          <span>If the brokerage blocks embedded viewing on your device, open the same live listings directly.</span>
          <a class="btn gold" href="https://abirhlal.myrealtyonegroup.com/my-featured-listings" target="_blank" rel="noopener">Open all listings</a>
        </div>
      </div>
    </section>'''

          pattern = re.compile(r'    <section class="showcase" id="listings">.*?    </section>', re.S)
          if not pattern.search(s):
              raise SystemExit('Existing listings section not found')
          s = pattern.sub(new_section, s, count=1)

          s = s.replace('.showcase{padding:40px 0}', '.showcase{padding:40px 0}.live-listings{padding:40px 0}.live-listings-head{display:block}.live-listings-head p{margin-top:14px}.listings-frame-wrap,.listings-frame{min-height:720px;height:720px}.listings-fallback{display:block}.listings-fallback .btn{margin-top:14px}')

          p.write_text(s)
          PY

      - name: Commit site change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/live-listings-prototype.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/live-listings-prototype.yml
          git commit -m 'Prototype live Realty ONE featured listings'
          git push
