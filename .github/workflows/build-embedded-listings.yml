name: Build embedded listings page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-embedded-listings.yml'

permissions:
  contents: write

jobs:
  build-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build internal listings page and update links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Route all listing entry points through our own Abir.ca page.
          s = s.replace('<a href="#listings">Listings</a>', '<a href="listings.html">Listings</a>')
          s = s.replace('<a class="btn gold" href="#listings">View listings</a>', '<a class="btn gold" href="listings.html">View listings</a>')
          s = s.replace('<a class="tile" href="https://abirhlal.myrealtyonegroup.com/my-featured-listings" target="_blank" rel="noopener" aria-label="View Abir Hlal\'s listings">', '<a class="tile" href="listings.html" aria-label="View Abir Hlal\'s listings">')
          p.write_text(s)

          style = re.search(r'<style>.*?</style>', s, re.S).group(0)
          header = re.search(r'<header>.*?</header>', s, re.S).group(0)

          # On the internal page, all navigation still behaves as the Abir.ca portal.
          header = header.replace('href="#home"', 'href="index.html#home"')
          header = header.replace('href="#about"', 'href="index.html#about"')
          header = header.replace('href="#buy"', 'href="index.html#buy"')
          header = header.replace('href="#sell"', 'href="index.html#sell"')
          header = header.replace('href="#communities"', 'href="index.html#communities"')
          header = header.replace('href="#contact"', 'href="index.html#contact"')
          header = header.replace('href="listings.html"', 'href="listings.html"')

          listings = f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0b0b0c">
            <meta name="description" content="Abir Hlal featured real estate listings.">
            <title>Featured Listings | ABIR.CA</title>
            {style}
            <style>
              html,body{{height:100%;overflow:hidden}}
              body{{display:flex;flex-direction:column}}
              header{{flex:0 0 auto}}
              .listings-shell{{flex:1;min-height:0;background:#fff;position:relative}}
              .listings-frame{{display:block;width:100%;height:100%;border:0;background:#fff}}
              .frame-note{{position:absolute;left:18px;bottom:14px;z-index:2;background:rgba(11,11,12,.88);color:#d7d3ce;border:1px solid #2a2a2d;padding:8px 12px;border-radius:8px;font-size:11px;pointer-events:none}}
            </style>
          </head>
          <body>
            {header}
            <main class="listings-shell">
              <iframe class="listings-frame" src="https://abirhlal.myrealtyonegroup.com/my-featured-listings" title="Abir Hlal featured listings" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
              <noscript><div class="frame-note">JavaScript is required to view listings.</div></noscript>
            </main>
            <script>
              const menuBtn=document.getElementById('menuBtn'), mobileLinks=document.getElementById('mobileLinks');
              if(menuBtn&&mobileLinks){{
                menuBtn.addEventListener('click',()=>{{const open=mobileLinks.classList.toggle('open');menuBtn.setAttribute('aria-expanded',open);menuBtn.textContent=open?'×':'☰'}});
                mobileLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{{mobileLinks.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');menuBtn.textContent='☰'}}));
              }}
            </script>
          </body>
          </html>'''

          Path('listings.html').write_text(listings)
          PY

          rm .github/workflows/build-embedded-listings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html listings.html .github/workflows/build-embedded-listings.yml
          git commit -m 'Add internal embedded listings page'
          git push
