name: Add Testimonials Section
'on':
  push:
    paths:
      - '.github/workflows/add-testimonials-section.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add testimonial section shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<a href="#awards">Awards</a><a href="#contact">Contact</a>', '<a href="#awards">Awards</a><a href="#testimonials">Testimonials</a><a href="#contact">Contact</a>')
          css = base64.b64decode('').decode()
          html = base64.b64decode('').decode()
          css_anchor = '    .cta{padding:36px 0;background:#0a0a0b;border-top:1px solid #151517}'
          if '.testimonials{' not in s:
              s = s.replace(css_anchor, css + css_anchor)
          section_anchor = '    <section class="cta" id="contact">'
          if 'id="testimonials"' not in s:
              s = s.replace(section_anchor, html + section_anchor)
          s = s.replace('      .awards{padding:48px 0}.awards-head{display:block}.awards-head p{margin-top:14px}.awards-grid{grid-template-columns:1fr}.award-card{min-height:190px}.cta-grid{display:block}.cta .btn{margin-top:22px}.cta h3{font-size:32px}', '      .awards{padding:48px 0}.awards-head{display:block}.awards-head p{margin-top:14px}.awards-grid{grid-template-columns:1fr}.award-card{min-height:190px}.testimonials{padding:48px 0}.testimonial-shell{padding:32px 22px}.testimonial-placeholder .btn{width:100%}.cta-grid{display:block}.cta .btn{margin-top:22px}.cta h3{font-size:32px}')
          p.write_text(s)
          PY
      - name: Commit update and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-testimonials-section.yml
          git add index.html .github/workflows/add-testimonials-section.yml
          git commit -m "Add client testimonials section"
          git push
