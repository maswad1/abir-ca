name: Polish About Section
'on':
  push:
    paths:
      - '.github/workflows/run-polish-about.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish About section
        run: python3 .github/scripts/polish_about.py
      - name: Commit update and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-polish-about.yml .github/scripts/polish_about.py
          git add index.html .github/workflows/run-polish-about.yml .github/scripts/polish_about.py
          git commit -m "Polish About Abir section"
          git push
