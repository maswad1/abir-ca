name: Import Abir photo assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-abir-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Drive photo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pictures
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c2f4-81f5-a791-23c253ce1b14/raw?se=2026-10-27T20%3A45%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=dc899842-f2a3-5484-9bdb-f6431021b914&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A24%3A03Z&ske=2026-10-28T12%3A24%3A03Z&sks=b&skv=2026-02-06&sig=Uf0Yi5Qk29fRrH8oWo%2BIl3dnwCG8kHA/Cq7NzRhwPSo%3D' -o pictures/abir_photo_3.png
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9a8c-81f5-94d8-e56104a30314/raw?se=2026-10-27T20%3A45%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=c390acdc-5b6f-57c8-9d73-aac3cb0bbe48&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T14%3A01%3A59Z&ske=2026-10-28T14%3A01%3A59Z&sks=b&skv=2026-02-06&sig=aULB6trQT8NrocVojFe5Z6fnV4qnhqPl8B/3WtE0Jck%3D' -o pictures/abir_photo_6.png
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c468-81f5-bcc2-50c163dbe467/raw?se=2026-10-27T20%3A45%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=8bc32cce-5283-584d-8f34-27eaf6a89607&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T11%3A56%3A27Z&ske=2026-10-28T11%3A56%3A27Z&sks=b&skv=2026-02-06&sig=YtDmDG0dSVbzXRr2iY1%2B41teoG9o5Q4u/cir4g1mc1Q%3D' -o pictures/abir_photo_5.png
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-eb18-81f5-825b-259bc028e12e/raw?se=2026-10-27T20%3A45%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=73b95d28-1bc1-5c27-8984-ac1810c24044&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A05%3A18Z&ske=2026-10-28T12%3A05%3A18Z&sks=b&skv=2026-02-06&sig=id4JsaAJe13HdCzLxxoKy0jXAOoo5cyCc1H4PDUfVJA%3D' -o pictures/abir_photo_7.png
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1708-81f5-a5f4-fbb4b389860c/raw?se=2026-10-27T20%3A45%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=097cfc95-e342-57ae-94bb-ee2bc6b14a7f&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T10%3A50%3A54Z&ske=2026-10-28T10%3A50%3A54Z&sks=b&skv=2026-02-06&sig=sLwQ6RVBnACik6tT5QeBbHN%2BcE3AyDgnjarvE8vbE4Q%3D' -o pictures/abir_photo_2.png

      - name: Switch site references to GitHub photos and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          for n in (2,3,5,6,7):
              s = s.replace(f'abir_photo_{n}.jpg', f'abir_photo_{n}.png')
          p.write_text(s)
          PY
          rm .github/workflows/import-abir-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pictures index.html .github/workflows/import-abir-assets.yml
          git commit -m 'Import Abir photo assets from Drive'
          git push
