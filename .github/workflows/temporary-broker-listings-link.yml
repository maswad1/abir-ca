name: Temporary broker listings link updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-broker-listings-link.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point listings to live brokerage page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          broker = 'https://abirhlal.myrealtyonegroup.com/my-featured-listings'

          p = Path('index.html')
          s = p.read_text()

          # All existing internal listing links now open the live brokerage listings.
          s = s.replace('href="listings.html"', f'href="{broker}" target="_blank" rel="noopener"')

          # Replace the blocked iframe section with a simple live-listings handoff.
          replacement = f'''    <section class="showcase" id="listings">
      <div class="wrap">
        <div class="showcase-head">
          <div><div class="eyebrow">Featured listings</div><h2>View Abir's live listings.</h2></div>
          <p>Listings are updated directly by Abir's brokerage system. Until the official website integration is provided, use the live Realty ONE Group listing page for the most current inventory and status.</p>
        </div>
        <a class="btn gold" href="{broker}" target="_blank" rel="noopener">View live listings</a>
      </div>
    </section>'''
          s, n = re.subn(r'    <section class="live-listings" id="listings">.*?    </section>', replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Live listings iframe section not found')

          p.write_text(s)

          # Keep the old listings.html path working by redirecting it to the brokerage page.
          Path('listings.html').write_text(f'''<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0; url={broker}">
  <title>Abir Hlal Listings</title>
  <script>window.location.replace({broker!r});</script>
</head>
<body>
  <p>Opening Abir Hlal's live listings… <a href="{broker}">Continue to listings</a></p>
</body>
</html>''')
          PY

      - name: Commit changes and remove updater
        shell: bash
        run: |
          rm .github/workflows/temporary-broker-listings-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html listings.html .github/workflows/temporary-broker-listings-link.yml
          git commit -m 'Temporarily direct listings to Realty ONE Group'
          git push
