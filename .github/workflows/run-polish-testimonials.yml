name: Polish Testimonials Section
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/polish_testimonials.py'
jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Polish Testimonials section
        run: python .github/scripts/polish_testimonials.py
      - name: Commit update and remove temporary updater
        run: |
          rm -f .github/scripts/polish_testimonials.py .github/workflows/run-polish-testimonials.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Testimonials section" || exit 0
          git push
