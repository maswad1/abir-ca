<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Abir Hlal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0b0b}
    body{min-height:100svh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;overflow:hidden}
    .stage{position:relative;width:min(460px,90vw);display:flex;align-items:center;justify-content:center}
    video{display:block;width:100%;height:auto;max-height:86svh;object-fit:contain;background:#000;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.42)}
    .sound-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:14px;letter-spacing:.2px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s ease}
    .sound-hint.show{opacity:1}
    @media (max-width:600px){body{padding:14px}.stage{width:min(92vw,460px)}video{max-height:82svh;border-radius:12px}.sound-hint{bottom:14px;font-size:13px}}
  </style>
</head>
<body>
  <div class="stage">
    <video id="hero" playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
    <div id="soundHint" class="sound-hint">Tap anywhere for sound</div>
  </div>
  <script>
    (async () => {
      const video = document.getElementById('hero');
      const hint = document.getElementById('soundHint');
      const files = [0,1,2,3,4,5].map(i => `video/chunk_${String(i).padStart(2,'0')}.txt?v=2`);
      const parts = await Promise.all(files.map(async url => {
        const r = await fetch(url, {cache:'no-store'});
        if (!r.ok) throw new Error(`Unable to load ${url}`);
        return r.text();
      }));
      const b64 = parts.join('').replace(/\s+/g,'');
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
      video.src = URL.createObjectURL(new Blob([bytes], {type:'video/mp4'}));
      video.muted = false;
      video.loop = false;
      video.controls = false;

      try {
        await video.play();
      } catch (e) {
        hint.classList.add('show');
        const startWithSound = async () => {
          document.removeEventListener('pointerdown', startWithSound);
          hint.classList.remove('show');
          video.currentTime = 0;
          video.muted = false;
          try { await video.play(); } catch (_) {}
        };
        document.addEventListener('pointerdown', startWithSound, {once:true});
      }
    })();
  </script>
</body>
</html>
