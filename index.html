<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Abir Hlal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0b0b}
    body{min-height:100svh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;overflow:hidden}
    .stage{position:relative;width:min(340px,82vw);display:flex;align-items:center;justify-content:center;cursor:pointer}
    video{display:block;width:100%;height:auto;max-height:84svh;object-fit:contain;background:#000;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.42)}
    .start{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.12);color:#fff;text-align:center;user-select:none}
    .start span{padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.68);font-size:14px;letter-spacing:.2px}
    .start.hide{display:none}
    @media (max-width:600px){
      body{padding:12px}
      .stage{width:min(88vw,340px)}
      video{max-height:80svh;border-radius:12px}
      .start{border-radius:12px}
      .start span{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="hero" playsinline preload="auto" controlslist="nodownload noplaybackrate noremoteplayback">
      <source src="video/Video1.mp4?v=1" type="video/mp4">
    </video>
    <div id="start" class="start"><span>Tap to play with sound</span></div>
  </div>
  <script>
    (() => {
      const video = document.getElementById('hero');
      const stage = document.getElementById('stage');
      const start = document.getElementById('start');

      video.muted = false;
      video.volume = 1;
      video.loop = false;
      video.controls = false;

      const playOnceWithSound = async () => {
        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;
        try {
          await video.play();
          start.classList.add('hide');
          stage.removeEventListener('pointerdown', playOnceWithSound);
        } catch (_) {
          start.classList.remove('hide');
        }
      };

      stage.addEventListener('pointerdown', playOnceWithSound);

      video.addEventListener('ended', () => {
        video.pause();
        video.currentTime = 0;
      });
    })();
  </script>
</body>
</html>
