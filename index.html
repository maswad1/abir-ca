<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Abir Hlal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    video{width:100vw;height:100vh;display:block;object-fit:cover;background:#000}
  </style>
</head>
<body>
  <video id="hero" autoplay muted loop playsinline controls></video>
  <script>
    (async () => {
      const files = [0,1,2,3,4,5].map(i => `video/chunk_${String(i).padStart(2,'0')}.txt?v=1`);
      const parts = await Promise.all(files.map(async url => {
        const r = await fetch(url, {cache:'no-store'});
        if (!r.ok) throw new Error(`Unable to load ${url}`);
        return r.text();
      }));
      const b64 = parts.join('').replace(/\s+/g,'');
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], {type:'video/mp4'});
      const video = document.getElementById('hero');
      video.src = URL.createObjectURL(blob);
      video.play().catch(() => {});
    })();
  </script>
</body>
</html>
