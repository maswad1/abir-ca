<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Abir Hlal featured real estate listings.">
  <title>Featured Listings | ABIR.CA</title>
  <style>
    :root{
      --bg:#0b0b0c; --panel:#18181a; --panel2:#111113; --ink:#f4f1ea;
      --muted:#b6b0aa; --gold:#c9a66b; --gold2:#dfbf86; --line:#28282b;
      --serif: Georgia, 'Times New Roman', serif; --sans: Arial, Helvetica, sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}
    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .wrap{width:min(1240px,calc(100% - 64px));margin:auto}
    header{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.03)}
    .nav{height:78px;display:flex;align-items:center;gap:32px}
    .brand{display:flex;flex-direction:column;line-height:.92;min-width:235px}
    .brand b{font:400 29px/1 var(--serif);letter-spacing:.04em}
    .brand small{margin-top:7px;color:var(--gold);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .links{display:flex;align-items:center;justify-content:center;gap:38px;flex:1;color:#d7d3ce;font-size:13px}
    .links a{transition:.2s}.links a:hover{color:var(--gold2)}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 28px;border:1px solid var(--gold);font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;transition:.2s;cursor:pointer}
    .btn.gold{background:var(--gold);color:#16120c}.btn.gold:hover{background:var(--gold2)}
    .btn.dark:hover{background:var(--gold);color:#16120c}
    .menu{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:26px}

    .hero{padding:32px 0 36px}
    .hero-grid{display:grid;grid-template-columns:1.22fr 1fr;gap:28px;align-items:stretch}
    .hero-photo{min-height:430px;border-radius:18px;overflow:hidden;background:#161616}
    .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 45%}
    .hero-copy{background:var(--panel);padding:46px 44px;display:flex;flex-direction:column;justify-content:center}
    .eyebrow{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
    h1{font-size:clamp(48px,5vw,70px);line-height:.94;letter-spacing:-.025em;margin:22px 0 28px}
    .lead{font:400 clamp(22px,2.1vw,29px)/1.2 var(--serif);color:#ddd8d1;max-width:520px;margin:0 0 22px}
    .sub{color:var(--muted);font-size:15px;max-width:520px;margin:0 0 34px}
    .actions{display:flex;gap:16px;flex-wrap:wrap}

    .pillars{border-top:1px solid #121214;border-bottom:1px solid #171719;background:#0a0a0b}
    .pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);min-height:84px;align-items:center;gap:28px}
    .pillar b{display:block;color:var(--gold);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
    .pillar span{font-size:11px;color:#9f9a94}

    .about{padding:42px 0 44px;background:#101012}
    .about-grid{display:grid;grid-template-columns:.82fr .88fr .60fr .60fr;gap:28px;align-items:center}
    .about-main{height:300px;border-radius:16px;overflow:hidden}
    .about-main img{height:100%;width:100%;object-fit:cover;object-position:center 35%}
    .about-copy{padding:10px 8px}
    h2{font-size:clamp(36px,3.4vw,52px);line-height:1.02;margin:16px 0 24px}
    .about-copy p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 30px}
    .tile{align-self:stretch;display:flex;flex-direction:column;justify-content:center}
    .tile-frame{height:205px;border-radius:14px;overflow:hidden;position:relative;background:#19191b}
    .tile-frame img{height:100%;width:100%;object-fit:cover}
    .tile-label{color:var(--gold);font-size:12px;font-weight:700;margin-top:14px;text-transform:uppercase}
    .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,rgba(0,0,0,.08));border:0;cursor:pointer}
    .play span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#efe9dd;color:#9d7945;border:2px solid var(--gold);font-size:26px;padding-left:5px;box-shadow:0 7px 24px rgba(0,0,0,.22)}

    .showcase{padding:56px 0;background:#0d0d0f;border-top:1px solid var(--line)}
    .showcase-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}
    .showcase-head h2{margin:8px 0 0}.showcase-head p{max-width:430px;color:var(--muted);font-size:14px;margin:0}
    .showcase-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    .feature{position:relative;min-height:390px;overflow:hidden;border-radius:18px;border:1px solid #242426}
    .feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.72))}
    .feature-copy{position:absolute;z-index:2;left:30px;right:30px;bottom:28px}
    .feature-copy b{color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .feature-copy h3{font-size:33px;margin-top:7px}

    .cta{padding:36px 0;background:#0a0a0b;border-top:1px solid #151517}
    .cta-grid{display:flex;align-items:center;justify-content:space-between;gap:30px}
    .cta h3{font-size:36px}.cta p{color:#aaa59f;margin:5px 0 0;font:16px var(--serif)}
    footer{padding:25px 0 34px;border-top:1px solid #151517;color:#77736f;font-size:11px}
    .foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

    dialog{width:min(900px,92vw);padding:0;border:1px solid #3a342b;background:#050505;border-radius:16px;box-shadow:0 30px 100px rgba(0,0,0,.7)}
    dialog::backdrop{background:rgba(0,0,0,.84)}
    .video-shell{position:relative}.video-shell video{width:100%;display:block;max-height:82vh;background:#000;border-radius:16px}
    .close{position:absolute;right:12px;top:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.65);color:#fff;font-size:21px;cursor:pointer}

    @media(max-width:980px){
      .wrap{width:min(100% - 36px,760px)}
      .links,.nav>.btn{display:none}.menu{display:block}.brand{min-width:auto}
      .hero-grid{grid-template-columns:1fr}.hero-photo{min-height:520px}.hero-copy{padding:40px 34px}
      .pillar-grid{grid-template-columns:1fr 1fr;padding:18px 0}
      .about-grid{grid-template-columns:1fr 1fr}.about-copy{padding:10px 0}.about-main{height:430px}
      .tile-frame{height:280px}.showcase-grid{grid-template-columns:1fr}.feature{min-height:500px}
      .mobile-links{display:none;position:absolute;left:0;right:0;top:78px;background:#0d0d0f;border-top:1px solid #262626;padding:18px 24px 24px}
      .mobile-links.open{display:grid;gap:18px}.mobile-links a{font-size:15px;color:#e7e1da}
    }
    @media(max-width:620px){
      .wrap{width:calc(100% - 28px)}.nav{height:68px}.mobile-links{top:68px}
      .brand b{font-size:25px}.brand small{font-size:8px}
      .hero{padding:18px 0 24px}.hero-photo{min-height:390px;border-radius:14px}
      .hero-copy{padding:34px 24px}.lead{font-size:23px}.sub{font-size:14px}.btn{width:100%}
      .pillar-grid{grid-template-columns:1fr 1fr;gap:20px 16px}.about{padding:30px 0}
      .about-grid{grid-template-columns:1fr}.about-main{height:440px}.tile-frame{height:350px}
      .showcase{padding:40px 0}.showcase-head{display:block}.showcase-head p{margin-top:14px}.feature{min-height:460px}
      .cta-grid{display:block}.cta .btn{margin-top:22px}.cta h3{font-size:32px}
    }
  </style>
  <style>
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column}
    header{flex:0 0 auto}
    .listings-shell{flex:1;min-height:0;background:#fff;position:relative}
    .listings-frame{display:block;width:100%;height:100%;border:0;background:#fff}
    .frame-note{position:absolute;left:18px;bottom:14px;z-index:2;background:rgba(11,11,12,.88);color:#d7d3ce;border:1px solid #2a2a2d;padding:8px 12px;border-radius:8px;font-size:11px;pointer-events:none}
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html#home" aria-label="Abir.ca home"><b>ABIR.CA</b><small>ABIR HLAL | REAL ESTATE</small></a>
      <nav class="links" aria-label="Main navigation">
        <a href="index.html#home">Home</a><a href="index.html#about">About</a><a href="listings.html">Listings</a><a href="index.html#buy">Buy</a><a href="index.html#sell">Sell</a><a href="index.html#communities">Communities</a><a href="index.html#contact">Contact</a>
      </nav>
      <a class="btn gold" href="index.html#contact">Get in touch</a>
      <button class="menu" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
    <nav class="mobile-links" id="mobileLinks" aria-label="Mobile navigation">
      <a href="index.html#home">Home</a><a href="index.html#about">About</a><a href="listings.html">Listings</a><a href="index.html#buy">Buy</a><a href="index.html#sell">Sell</a><a href="index.html#communities">Communities</a><a href="index.html#contact">Contact</a>
    </nav>
  </header>
  <main class="listings-shell">
    <iframe class="listings-frame" src="https://abirhlal.myrealtyonegroup.com/my-featured-listings" title="Abir Hlal featured listings" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <noscript><div class="frame-note">JavaScript is required to view listings.</div></noscript>
  </main>
  <script>
    const menuBtn=document.getElementById('menuBtn'), mobileLinks=document.getElementById('mobileLinks');
    if(menuBtn&&mobileLinks){
      menuBtn.addEventListener('click',()=>{const open=mobileLinks.classList.toggle('open');menuBtn.setAttribute('aria-expanded',open);menuBtn.textContent=open?'×':'☰'});
      mobileLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobileLinks.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');menuBtn.textContent='☰'}));
    }
  </script>
</body>
</html>
